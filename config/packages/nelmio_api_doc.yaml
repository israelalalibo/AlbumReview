nelmio_api_doc:
    documentation:
        info:
            title: AlbumReviews API
            description: |
                RESTful API for the Music Album Review Website.
                
                ## Authentication
                This API uses JWT Bearer token authentication. To access protected endpoints:
                1. Call `POST /api/v1/auth/login` with your credentials
                2. Use the returned token in the `Authorization` header: `Bearer <token>`
                
                ## Resources
                - **Albums**: CRUD operations for music albums
                - **Reviews**: Reviews as sub-resources of albums
                - **Music Info**: External API integrations (MusicBrainz, Discogs)
            version: '1.0.0'
            contact:
                name: API Support
                email: support@albumreviews.com
        servers:
            - url: https://127.0.0.1:8000
              description: Local development server
        components:
            securitySchemes:
                Bearer:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
                    description: 'Enter your JWT token (without "Bearer " prefix)'
        security:
            - Bearer: []
    areas:
        path_patterns:
            - ^/api(?!/doc$)
