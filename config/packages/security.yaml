security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email  # ← Should match log in field (Remember when going over steps)
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        api:
            pattern: ^/api/
            stateless: true
            provider: app_user_provider
            access_token:
                token_handler: App\Security\ApiTokenHandler
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: home
                username_parameter: email    # ← Must match form field name
                password_parameter: password
                enable_csrf: true

            logout:
                path: app_logout
                target: home

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # control access for large sections
    # Note from lecture: Only the *first* access control that matches will be used
    access_control:
        # API routes - allow public access for login and GET requests
        - { path: ^/api/v1/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/albums, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/albums/\d+$, methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/albums/\d+/reviews, methods: [GET], roles: PUBLIC_ACCESS }
        # Web routes
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/albums/new, roles: ROLE_USER }
        - { path: ^/albums/.*/edit, roles: ROLE_USER }
        - { path: ^/albums/.*/reviews, roles: ROLE_USER }

    # Role hierarchy
    role_hierarchy:
        ROLE_MODERATOR: ROLE_USER
        ROLE_ADMIN: [ ROLE_MODERATOR, ROLE_USER ]

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
